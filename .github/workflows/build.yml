name: Build ESP32-S3 Gemini AI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SKETCH: ESP32S3_Gemini_AI
      FQBN: esp32:esp32:esp32s3:PSRAM=opi,FlashSize=16M,PartitionScheme=app3M_fat9M_16MB,CDCOnBoot=default,USBMode=hwcdc
    steps:
      - uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core & libraries
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install "Adafruit GFX Library" "Adafruit ST7735 and ST7789 Library" "ArduinoJson"

      - name: Compile
        run: |
          arduino-cli compile --fqbn "$FQBN" --export-binaries --output-dir build "$SKETCH"
          ls -la build

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32s3
          path: build/*.bin
